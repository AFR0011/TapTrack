name: Patch linked reset settings

on:
  push:
    branches:
      - remediation/taptrack-correctness-b002
    paths:
      - .github/workflows/patch-reset-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remediation/taptrack-correctness-b002
      - name: Patch Settings reset flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SettingsWorkspace.tsx')
          text = path.read_text()

          text = text.replace(
              "import { db, ensureDatabaseSeeded } from '@/database';",
              "import { db } from '@/database';"
          )
          text = text.replace(
              "import {\n  restoreOnlyThisDevice,\n  restoreSyncedAccount,\n} from '@/exports/linkedRestoreService';",
              "import {\n  restoreOnlyThisDevice,\n  restoreSyncedAccount,\n} from '@/exports/linkedRestoreService';\nimport { resetOnlyThisDevice, resetSyncedAccount } from '@/exports/resetService';"
          )
          text = text.replace(
              "import { RestoreScopeDialog } from './RestoreScopeDialog';",
              "import { RestoreScopeDialog } from './RestoreScopeDialog';\nimport { ResetScopeDialog } from './ResetScopeDialog';"
          )
          text = text.replace(
              "  const [showResetConfirm, setShowResetConfirm] = useState(false);",
              "  const [showResetConfirm, setShowResetConfirm] = useState(false);\n  const [showResetScope, setShowResetScope] = useState(false);\n  const [showAccountResetConfirm, setShowAccountResetConfirm] = useState(false);\n  const [resetBusy, setResetBusy] = useState(false);"
          )

          marker = "  const clearPendingRestore = useCallback(() => {"
          insert = """  const persistPreResetSafetyBackup = useCallback((safetyBackup: string) => {
    const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
    downloadText(
      `taptrack-pre-reset-${timestamp}.json`,
      safetyBackup,
      'application/json'
    );
  }, []);

"""
          if marker not in text:
              raise SystemExit('clearPendingRestore marker not found')
          text = text.replace(marker, insert + marker, 1)

          old_reset = """

  const resetAppData = async () => {
    await db.transaction(
      'rw',
      [
        db.transactions,
        db.balances,
        db.balanceCheckpoints,
        db.categories,
        db.monthlyBudgets,
        db.categoryBudgets,
        db.recurringTransactions,
        db.conversions,
        db.settings,
      ],
      async () => {
        await Promise.all([
          db.transactions.clear(),
          db.balances.clear(),
          db.balanceCheckpoints.clear(),
          db.categories.clear(),
          db.monthlyBudgets.clear(),
          db.categoryBudgets.clear(),
          db.recurringTransactions.clear(),
          db.conversions.clear(),
          db.settings.clear(),
        ]);
      }
    );
    await ensureDatabaseSeeded();
    await refreshSyncStatus();
    toast.success('Local app data reset. Setup will show again.');
  };
"""
          new_reset = """

  const executeDeviceOnlyReset = async () => {
    if (resetBusy) return;
    setResetBusy(true);
    try {
      await resetOnlyThisDevice(persistPreResetSafetyBackup, db);
      await refreshSyncStatus();
      setShowResetConfirm(false);
      setShowResetScope(false);
      toast.success(
        syncStatus?.bindingState === 'linked'
          ? 'This device was reset and disconnected from cloud sync. The synced account was left unchanged.'
          : 'Local app data reset. A pre-reset safety backup was downloaded and setup will show again.'
      );
    } catch (err) {
      toast.error(err instanceof Error ? err.message : 'This device could not be reset.');
    } finally {
      setResetBusy(false);
    }
  };

  const executeAccountReset = async () => {
    if (resetBusy) return;
    setResetBusy(true);
    try {
      await resetSyncedAccount(persistPreResetSafetyBackup, db);
      await refreshSyncStatus();
      setShowAccountResetConfirm(false);
      setShowResetScope(false);
      toast.success('Synced account reset. Other linked devices will adopt the fresh ledger.');
    } catch (err) {
      toast.error(err instanceof Error ? err.message : 'Synced account could not be reset.');
      setShowResetScope(true);
    } finally {
      setResetBusy(false);
    }
  };
"""
          if old_reset not in text:
              raise SystemExit('old resetAppData block not found')
          text = text.replace(old_reset, new_reset, 1)

          text = text.replace(
              "          Permanently erase local transactions, balances, reconciliation history, budgets,\n          categories, and settings. This cannot be undone.",
              "          Reset to a fresh ledger. Linked browsers can reset only this device or the synced\n          account everywhere. A safety backup is downloaded before anything is replaced."
          )
          text = text.replace(
              "          onClick={() => setShowResetConfirm(true)}",
              "          onClick={() => {\n            if (syncStatus?.bindingState === 'linked') setShowResetScope(true);\n            else setShowResetConfirm(true);\n          }}"
          )

          restore_dialog = """      <RestoreScopeDialog
        open={showRestoreScope}
        busy={restoreBusy}
        onRestoreAccount={() => {
          setShowRestoreScope(false);
          setShowAccountRestoreConfirm(true);
        }}
        onRestoreDevice={() => void executeDeviceOnlyRestore()}
        onCancel={clearPendingRestore}
      />

"""
          reset_dialog = """      <ResetScopeDialog
        open={showResetScope}
        busy={resetBusy}
        onResetAccount={() => {
          setShowResetScope(false);
          setShowAccountResetConfirm(true);
        }}
        onResetDevice={() => void executeDeviceOnlyReset()}
        onCancel={() => setShowResetScope(false)}
      />

"""
          if restore_dialog not in text:
              raise SystemExit('restore dialog block not found')
          text = text.replace(restore_dialog, restore_dialog + reset_dialog, 1)

          account_restore_confirm = """      <ConfirmDialog
        open={showAccountRestoreConfirm}
        title=\"Replace synced account ledger\"
        message=\"This will replace the signed-in account’s canonical finance ledger with the selected backup. Other linked devices will adopt the restored ledger, and stale pre-restore pending changes on those devices will be discarded.\"
        confirmLabel=\"Replace synced account\"
        confirmVariant=\"danger\"
        onConfirm={() => {
          setShowAccountRestoreConfirm(false);
          void executeAccountRestore();
        }}
        onCancel={() => {
          setShowAccountRestoreConfirm(false);
          setShowRestoreScope(true);
        }}
      />

"""
          account_reset_confirm = """      <ConfirmDialog
        open={showAccountResetConfirm}
        title=\"Reset synced account everywhere\"
        message=\"This will replace the signed-in account with a fresh empty ledger. Every linked device will adopt the reset state, and stale pending changes from before the reset will be discarded. A safety backup is downloaded first.\"
        confirmLabel=\"Reset synced account\"
        confirmVariant=\"danger\"
        onConfirm={() => {
          setShowAccountResetConfirm(false);
          void executeAccountReset();
        }}
        onCancel={() => {
          setShowAccountResetConfirm(false);
          setShowResetScope(true);
        }}
      />

"""
          if account_restore_confirm not in text:
              raise SystemExit('account restore confirm block not found')
          text = text.replace(account_restore_confirm, account_restore_confirm + account_reset_confirm, 1)

          old_local_confirm = """      <ConfirmDialog
        open={showResetConfirm}
        title=\"Reset local app data\"
        message=\"This will erase the local finance ledger and reconciliation history on this browser. Cloud reset behavior is handled separately.\"
        confirmLabel=\"Reset local data\"
        confirmVariant=\"danger\"
        onConfirm={async () => {
          setShowResetConfirm(false);
          await resetAppData();
        }}
        onCancel={() => setShowResetConfirm(false)}
      />
"""
          new_local_confirm = """      <ConfirmDialog
        open={showResetConfirm}
        title=\"Reset local app data\"
        message=\"This will replace this browser’s ledger with a fresh empty ledger. A safety backup is downloaded first.\"
        confirmLabel=\"Reset local data\"
        confirmVariant=\"danger\"
        onConfirm={() => void executeDeviceOnlyReset()}
        onCancel={() => setShowResetConfirm(false)}
      />
"""
          if old_local_confirm not in text:
              raise SystemExit('old local reset confirm block not found')
          text = text.replace(old_local_confirm, new_local_confirm, 1)

          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsWorkspace.tsx
          git commit -m "Wire linked reset scope choices"
          git push
