name: Fix linked restore compile

on:
  push:
    branches:
      - remediation/taptrack-correctness-b002
    paths:
      - .github/workflows/fix-linked-restore-compile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/taptrack-correctness-b002
          fetch-depth: 0
      - run: python scripts/fix_linked_restore_compile.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sync/syncService.ts src/sync/syncService.test.ts src/sync/multiDeviceSync.test.ts supabase/migrations/20260908_ledger_restore_generation.sql
          git commit -m "Fix linked restore generation compilation"
          git push origin HEAD:remediation/taptrack-correctness-b002
