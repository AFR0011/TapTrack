name: Harden generation-consistent pull

on:
  push:
    branches:
      - remediation/taptrack-correctness-b002
    paths:
      - .github/workflows/harden-generation-consistent-pull.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/taptrack-correctness-b002
          fetch-depth: 0
      - run: python scripts/harden_generation_consistent_pull.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sync/syncService.ts src/sync/multiDeviceSync.test.ts
          git commit -m "Make cloud pulls generation-consistent"
          git push origin HEAD:remediation/taptrack-correctness-b002
