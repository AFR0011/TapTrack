name: Patch ledger generation migration

on:
  push:
    branches:
      - remediation/taptrack-correctness-b002
    paths:
      - .github/workflows/patch-ledger-generation-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/taptrack-correctness-b002
          fetch-depth: 0
      - run: python scripts/patch_ledger_generation_migration.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260908_ledger_restore_generation.sql
          git commit -m "Harden ledger generation restore serialization"
          git push origin HEAD:remediation/taptrack-correctness-b002
