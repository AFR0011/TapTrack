name: Fix generation assertions

on:
  push:
    branches:
      - remediation/taptrack-correctness-b002
    paths:
      - .github/workflows/fix-generation-assertions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/taptrack-correctness-b002
          fetch-depth: 0
      - run: python scripts/fix_generation_assertions.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sync/multiDeviceSync.test.ts
          git commit -m "Fix ledger generation acceptance assertions"
          git push origin HEAD:remediation/taptrack-correctness-b002
