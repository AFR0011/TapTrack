name: Next 16 Upgrade Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      TELEGRAM_BOT_TOKEN: test-bot-token
      TELEGRAM_WEBHOOK_SECRET: test-webhook-secret
      TAPTRACK_OWNER_TELEGRAM_CHAT_ID: "1"
      TAPTRACK_OWNER_USER_ID: 00000000-0000-0000-0000-000000000000
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5:1.5b
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Apply React 19 source migration
        run: python scripts/apply-next16-react19-fixes.py

      - name: Regenerate lockfile
        run: npm install --package-lock-only

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full verification ladder
        run: npm run check

      - name: Route smoke against production build
        run: |
          npm run start > /tmp/taptrack-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/taptrack-next.log
              exit 1
            fi
            sleep 1
          done
          npm run smoke:routes

      - name: Export generated migration files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next16-generated-files
          if-no-files-found: error
          path: |
            package-lock.json
            tsconfig.json
            next-env.d.ts
            src/components/ReportsWorkspace.tsx
            src/components/SettingsWorkspace.tsx
