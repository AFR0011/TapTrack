name: Patch cloud disconnect settings

on:
  push:
    branches:
      - remediation/taptrack-correctness-b002
    paths:
      - .github/workflows/patch-cloud-disconnect-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remediation/taptrack-correctness-b002
      - name: Apply Settings disconnect patch
        run: python scripts/patch_cloud_disconnect_settings.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsWorkspace.tsx
          git commit -m "Add explicit device cloud disconnect"
          git push
