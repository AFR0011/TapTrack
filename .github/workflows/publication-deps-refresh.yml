name: Publication Dependency Refresh

on:
  pull_request:
    branches:
      - upgrade/next-16-lts

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      TELEGRAM_BOT_TOKEN: test-bot-token
      TELEGRAM_WEBHOOK_SECRET: test-webhook-secret
      TAPTRACK_OWNER_TELEGRAM_CHAT_ID: "1"
      TAPTRACK_OWNER_USER_ID: 00000000-0000-0000-0000-000000000000
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5:1.5b
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v7
        with:
          ref: publication/taptrack-release

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only

      - name: Install locked dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Route smoke against production build
        run: |
          npm run start > /tmp/taptrack-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/taptrack-next.log
              exit 1
            fi
            sleep 1
          done
          npm run smoke:routes

      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the audited toolchain."
          else
            git commit -m "Regenerate lockfile for audited dev toolchain"
            git push origin HEAD:publication/taptrack-release
          fi
