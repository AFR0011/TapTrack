name: Apply linked restore core

on:
  push:
    branches:
      - remediation/taptrack-correctness-b002
    paths:
      - .github/workflows/apply-linked-restore-core.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/taptrack-correctness-b002
          fetch-depth: 0
      - name: Apply linked restore core
        run: python scripts/apply_linked_restore_core.py
      - name: Commit linked restore core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/exports/backupService.ts src/sync/syncBinding.ts src/sync/syncService.ts
          git commit -m "Add linked restore generation core"
          git push origin HEAD:remediation/taptrack-correctness-b002
