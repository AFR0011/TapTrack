name: B005 lockfile refresh

on:
  push:
    branches:
      - feature/taptrack-b005-ux-accessibility-copy

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/taptrack-b005-ux-accessibility-copy

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Refresh only the required lockfile entries
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact vitest@4.1.11

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "Refresh lockfile for security patches"
          git push origin HEAD:feature/taptrack-b005-ux-accessibility-copy
