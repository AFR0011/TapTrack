name: Apply backup restore wiring

on:
  push:
    branches:
      - remediation/taptrack-correctness-b002
    paths:
      - .github/workflows/apply-backup-restore-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/taptrack-correctness-b002
          fetch-depth: 0

      - name: Apply restore wiring patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fix Dexie bulkPut typing and remove unused compatibility shim.
          path = Path('src/exports/backupService.ts')
          text = path.read_text()
          text = text.replace('  type Currency,\n  type Method,\n', '')
          old = """      await Promise.all([\n        putMany(database.transactions, normalized.data.transactions),\n        putMany(database.balanceCheckpoints, normalized.data.balanceCheckpoints),\n        putMany(database.categories, normalized.data.categories),\n        putMany(database.monthlyBudgets, normalized.data.monthlyBudgets),\n        putMany(database.categoryBudgets, normalized.data.categoryBudgets),\n        putMany(database.recurringTransactions, normalized.data.recurringTransactions),\n        putMany(database.conversions, normalized.data.conversions),\n        putMany(database.settings, normalized.data.settings),\n      ]);\n\n      await rebuildDerivedBalances(database, now.toISOString());\n"""
          new = """      if (normalized.data.transactions.length) {\n        await database.transactions.bulkPut(normalized.data.transactions);\n      }\n      if (normalized.data.balanceCheckpoints.length) {\n        await database.balanceCheckpoints.bulkPut(normalized.data.balanceCheckpoints);\n      }\n      if (normalized.data.categories.length) {\n        await database.categories.bulkPut(normalized.data.categories);\n      }\n      if (normalized.data.monthlyBudgets.length) {\n        await database.monthlyBudgets.bulkPut(normalized.data.monthlyBudgets);\n      }\n      if (normalized.data.categoryBudgets.length) {\n        await database.categoryBudgets.bulkPut(normalized.data.categoryBudgets);\n      }\n      if (normalized.data.recurringTransactions.length) {\n        await database.recurringTransactions.bulkPut(normalized.data.recurringTransactions);\n      }\n      if (normalized.data.conversions.length) {\n        await database.conversions.bulkPut(normalized.data.conversions);\n      }\n      if (normalized.data.settings.length) {\n        await database.settings.bulkPut(normalized.data.settings);\n      }\n\n      await rebuildDerivedBalances(database, now.toISOString());\n"""
          if old not in text:
              raise SystemExit('backupService bulkPut block not found')
          text = text.replace(old, new)
          start = text.index('async function putMany<T, Key>(')
          end = text.index('function countCanonicalRecords', start)
          text = text[:start] + text[end:]
          marker = "\n// Keep these imports type-checked against the supported unions; they also make\n// relationship error messages easier to reason about when those unions evolve.\nvoid (null as unknown as Currency | Method);\n"
          text = text.replace(marker, '\n')
          path.write_text(text)

          # Route public JSON export/import API through the canonical backup service.
          path = Path('src/exports/exportService.ts')
          text = path.read_text()
          import_marker = "import Papa from 'papaparse';\n"
          backup_import = """import Papa from 'papaparse';\nimport {\n  exportBackupJSON,\n  restoreBackupJSON,\n  type RestoreBackupOptions,\n  type RestoreBackupResult,\n  type TapTrackBackupV2,\n} from '@/exports/backupService';\n"""
          if import_marker not in text:
              raise SystemExit('exportService import marker not found')
          text = text.replace(import_marker, backup_import, 1)
          old_types = """import type {\n  Balance,\n  Category,\n  CategoryBudget,\n  Conversion,\n  MonthlyBudget,\n  RecurringTransaction,\n  Settings,\n  Transaction,\n} from '@/types';\n\nexport type TapTrackBackup = {\n  transactions: Transaction[];\n  balances: Balance[];\n  categories: Category[];\n  monthlyBudgets: MonthlyBudget[];\n  categoryBudgets: CategoryBudget[];\n  recurringTransactions: RecurringTransaction[];\n  conversions: Conversion[];\n  settings: Settings[];\n};\n"""
          new_types = """import type { Transaction } from '@/types';\n\nexport type TapTrackBackup = TapTrackBackupV2;\n"""
          if old_types not in text:
              raise SystemExit('exportService backup type block not found')
          text = text.replace(old_types, new_types, 1)
          old_functions = """export async function exportJSON(database: TapTrackDatabase = db): Promise<string> {\n  const data = await readBackup(database);\n  return JSON.stringify(data, null, 2);\n}\n\nexport async function importJSON(jsonData: string, database: TapTrackDatabase = db): Promise<void> {\n  const data = parseBackup(jsonData);\n\n  await database.transaction(\n    'rw',\n    [\n      database.transactions,\n      database.balances,\n      database.categories,\n      database.monthlyBudgets,\n      database.categoryBudgets,\n      database.recurringTransactions,\n      database.conversions,\n      database.settings,\n    ],\n    async () => {\n      await Promise.all([\n        database.transactions.clear(),\n        database.balances.clear(),\n        database.categories.clear(),\n        database.monthlyBudgets.clear(),\n        database.categoryBudgets.clear(),\n        database.recurringTransactions.clear(),\n        database.conversions.clear(),\n        database.settings.clear(),\n      ]);\n\n      await Promise.all([\n        data.transactions.length ? database.transactions.bulkPut(data.transactions) : undefined,\n        data.balances.length ? database.balances.bulkPut(data.balances) : undefined,\n        data.categories.length ? database.categories.bulkPut(data.categories) : undefined,\n        data.monthlyBudgets.length ? database.monthlyBudgets.bulkPut(data.monthlyBudgets) : undefined,\n        data.categoryBudgets.length ? database.categoryBudgets.bulkPut(data.categoryBudgets) : undefined,\n        data.recurringTransactions.length\n          ? database.recurringTransactions.bulkPut(data.recurringTransactions)\n          : undefined,\n        data.conversions.length ? database.conversions.bulkPut(data.conversions) : undefined,\n        data.settings.length ? database.settings.bulkPut(data.settings) : undefined,\n      ]);\n    }\n  );\n\n  await ensureDatabaseSeeded(database);\n}\n"""
          new_functions = """export async function exportJSON(database: TapTrackDatabase = db): Promise<string> {\n  return exportBackupJSON(database);\n}\n\nexport async function importJSON(\n  jsonData: string,\n  database: TapTrackDatabase = db,\n  options: RestoreBackupOptions = {}\n): Promise<RestoreBackupResult> {\n  return restoreBackupJSON(jsonData, database, options);\n}\n"""
          if old_functions not in text:
              raise SystemExit('exportService legacy JSON functions not found')
          text = text.replace(old_functions, new_functions, 1)
          start = text.index('async function readBackup(')
          end = text.index('function createSimplePdf', start)
          text = text[:start] + text[end:]
          path.write_text(text)

          # Update wrapper test to use replace semantics instead of the obsolete empty-object importer.
          path = Path('src/exports/exportService.test.ts')
          text = path.read_text()
          old_test = """  it('round-trips a full JSON backup', async () => {\n    await seedOpeningBalance(database, 'TRY-cash', 200);\n    await createTransaction(expense, database);\n\n    const backup = await exportJSON(database);\n    await importJSON(\n      JSON.stringify({\n        transactions: [],\n        balances: [],\n        categories: [],\n        monthlyBudgets: [],\n        categoryBudgets: [],\n        recurringTransactions: [],\n        conversions: [],\n        settings: [],\n      }),\n      database\n    );\n    expect(await database.transactions.count()).toBe(0);\n\n    await importJSON(backup, database);\n\n    expect(await database.transactions.count()).toBe(1);\n    expect(await database.categories.count()).toBe(6);\n    expect(await database.settings.count()).toBe(1);\n  });\n"""
          new_test = """  it('routes JSON export/import through versioned replace semantics', async () => {\n    await seedOpeningBalance(database, 'TRY-cash', 200);\n    await createTransaction(expense, database, new Date('2026-05-05T12:00:00.000Z'), 'coffee-original');\n\n    const backup = await exportJSON(database);\n    const parsed = JSON.parse(backup);\n    expect(parsed.format).toBe('taptrack-backup');\n    expect(parsed.version).toBe(2);\n    expect(parsed).not.toHaveProperty('balances');\n\n    await createTransaction(\n      { ...expense, amount: 20, title: 'extra', date: '2026-05-06' },\n      database,\n      new Date('2026-05-06T12:00:00.000Z'),\n      'coffee-extra'\n    );\n    expect(await database.transactions.count()).toBe(2);\n\n    await importJSON(backup, database);\n\n    expect((await database.transactions.toArray()).map((item) => item.id)).toEqual(['coffee-original']);\n    expect(await database.categories.count()).toBe(6);\n    expect(await database.settings.count()).toBe(1);\n  });\n"""
          if old_test not in text:
              raise SystemExit('exportService legacy round-trip test not found')
          path.write_text(text.replace(old_test, new_test, 1))

          # Make Settings expose restore semantics and persist the safety backup before replacement.
          path = Path('src/components/SettingsWorkspace.tsx')
          text = path.read_text()
          old_handler = """  const handleImportFile = async (file: File | undefined) => {\n    if (!file) return;\n    await importJSON(await file.text());\n    await refreshSyncStatus();\n    toast.success('JSON backup imported locally.');\n  };\n"""
          new_handler = """  const handleImportFile = async (file: File | undefined) => {\n    if (!file) return;\n\n    try {\n      const result = await importJSON(await file.text(), db, {\n        beforeReplace: (safetyBackup) => {\n          const timestamp = new Date().toISOString().replace(/[:.]/g, '-');\n          downloadText(\n            `taptrack-pre-restore-${timestamp}.json`,\n            safetyBackup,\n            'application/json'\n          );\n        },\n      });\n      await refreshSyncStatus();\n      toast.success(\n        result.legacyMigrated\n          ? 'Legacy backup restored locally and upgraded to the checkpoint ledger.'\n          : 'Backup restored locally. A pre-restore safety backup was downloaded.'\n      );\n    } catch (err) {\n      toast.error(err instanceof Error ? err.message : 'Backup could not be restored.');\n    } finally {\n      if (importInputRef.current) importInputRef.current.value = '';\n    }\n  };\n"""
          if old_handler not in text:
              raise SystemExit('Settings import handler not found')
          text = text.replace(old_handler, new_handler, 1)
          text = text.replace(
              '<p className="mt-1 text-sm text-muted">Export a backup or import from a JSON file.</p>',
              '<p className="mt-1 text-sm text-muted">Export a canonical backup or restore/replace this local ledger from JSON. A safety backup is downloaded before replacement.</p>',
              1,
          )
          text = text.replace('            Import JSON\n', '            Restore JSON\n', 1)
          text = text.replace(
              'onChange={(event) => handleImportFile(event.target.files?.[0])}',
              'onChange={(event) => void handleImportFile(event.target.files?.[0])}',
              1,
          )
          path.write_text(text)
          PY

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/exports/backupService.ts src/exports/exportService.ts src/exports/exportService.test.ts src/components/SettingsWorkspace.tsx
          git commit -m "Wire canonical backup restore flow"
          git push origin HEAD:remediation/taptrack-correctness-b002
