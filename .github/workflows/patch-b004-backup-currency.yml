name: Patch B004 backup currency validation

on:
  push:
    branches:
      - feature/taptrack-b004-personalization-dashboard
    paths:
      - .github/workflows/patch-b004-backup-currency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/taptrack-b004-personalization-dashboard
      - name: Fix dynamic backup budget assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/exports/backupService.test.ts')
          text = path.read_text()
          old = "expect((await database.monthlyBudgets.get('2026-05'))?.currency).toBe('GBP');"
          new = "expect((await database.monthlyBudgets.where('month').equals('2026-05').first())?.currency).toBe('GBP');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one monthly budget assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit assertion fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/exports/backupService.test.ts
          git commit -m "Fix dynamic backup budget assertion"
          git push
