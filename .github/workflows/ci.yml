name: Ravel final cleanup

on:
  push:

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/brand/ravel-public-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply final Ravel cleanup
        run: node scripts/finalize-ravel-cleanup.mjs

      - name: Commit cleanup if needed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Final Ravel cleanup already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Ravel naming cleanup"
          git push origin HEAD:brand/ravel-public-cleanup
