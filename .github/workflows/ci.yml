name: Ravel migration audit

on:
  push:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/brand/ravel-public-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Print remaining historical name references
        run: |
          node scripts/name-migration-audit.mjs
          exit 1
